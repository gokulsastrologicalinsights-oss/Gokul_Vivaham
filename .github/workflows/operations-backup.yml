name: Encrypted daily backup
on:
  schedule:
    - cron: '47 21 * * *' # 03:17 Asia/Kolkata; GitHub may delay scheduled runs.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'gokulsastrologicalinsights-oss/gokulvivaham' && github.ref == 'refs/heads/main' && (vars.BACKUPS_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: operations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Export and encrypt database and private files
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_OUTPUT: ${{ runner.temp }}/gokul-encrypted-backup
        run: node scripts/operations/backup.cjs
      - name: Check archive integrity before uploading
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node scripts/operations/unpack-backup.cjs "$RUNNER_TEMP/gokul-encrypted-backup" "$RUNNER_TEMP/gokul-backup-verification"
      - name: Store ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/gokul-encrypted-backup/*.enc
          if-no-files-found: error
          retention-days: 7
      - name: Remove plaintext verification files
        if: always()
        run: |
          node -e "const fs=require('node:fs'),p=require('node:path');fs.rmSync(p.join(process.env.RUNNER_TEMP,'gokul-backup-verification'),{recursive:true,force:true});"
